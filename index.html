<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visión de Radio 91.7 FM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Howler -->
    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #041b3d, #020c1b);
            color: #fff;
            text-align: center;
        }

        .container {
            max-width: 420px;
            margin: auto;
            padding: 20px;
        }

        /* LOGO */
        .radio-logo {
            max-width: 260px;
            width: 100%;
            margin: 10px auto 20px;
            display: block;
        }

        h1 {
            margin: 5px 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .frequency {
            background: #00f3ff;
            color: #000;
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .player-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: none;
            background: #ff00cc;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255,0,204,0.6);
        }

        .player-btn:active {
            transform: scale(0.95);
        }

        .status {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.9;
        }

        .social {
            margin-top: 30px;
        }

        .social a {
            color: #00f3ff;
            font-size: 26px;
            margin: 0 12px;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- LOGO (GitHub lo reconoce sin problemas) -->
        <img src="assets/img/logo.png" alt="Visión de Radio" class="radio-logo">

        <h1>VISIÓN DE RADIO</h1>
        <div class="frequency">91.7 FM</div>

        <br>

        <button class="player-btn" id="playBtn">
            <i class="fas fa-play"></i>
        </button>

        <div class="status" id="statusText">
            Transmisión en vivo
        </div>

        <div class="social">
            <a href="https://www.facebook.com/profile.php?id=61577297908440" target="_blank">
                <i class="fab fa-facebook"></i>
            </a>
            <a href="https://www.instagram.com/radiovision_oficial" target="_blank">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    </div>

    <script>
        const streamUrl = "https://fpsnew2.listen2myradio.com:2199/listen.php";

        const radio = new Howl({
            src: [streamUrl],
            html5: true,
            volume: 0.8
        });

        const playBtn = document.getElementById("playBtn");
        const statusText = document.getElementById("statusText");
        let playing = false;

        playBtn.addEventListener("click", () => {
            if (!playing) {
                radio.play();
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                statusText.textContent = "Reproduciendo en vivo";
                playing = true;
            } else {
                radio.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                statusText.textContent = "Transmisión en vivo";
                playing = false;
            }
        });
    </script>
</body>
</html>
